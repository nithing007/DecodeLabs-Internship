name: DecodeLabs Week 3 CI/CD Pipeline

on:
  push:
    branches:
      - main
      - devops/week-03-ci-cd
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Week-03-CI-CD-Pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'Week-03-CI-CD-Pipeline/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Validate syntax
        run: npm run validate:syntax

      - name: Run automated tests
        run: npm test
